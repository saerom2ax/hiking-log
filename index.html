<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="산행 기록">
<title>산행 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --paper:#F1F3EC; --paper2:#E8EBE0; --card:#FBFCF8;
  --ink:#16221B; --soft:#5B6960; --line:#D3D9C9;
  --contour:#B9AA85; --forest:#3F6B4E; --ribbon:#E04365; --ribbon-bg:#FBE6EB;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;font-family:var(--sans)}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:800;margin:0;letter-spacing:-.035em}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;letter-spacing:-.005em}
.sub{color:var(--soft);font-size:12px;font-weight:500}
[hidden]{display:none !important}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;
  border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand h1{font-size:21px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{font-size:13px;font-weight:600;padding:9px 16px;border-radius:2px;border:1px solid var(--ink);
  background:none;color:var(--ink);cursor:pointer;transition:.15s}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--forest);border-color:var(--forest)}
.btn.ghost{border-color:var(--line);color:var(--soft)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink)}
.btn.danger:hover{border-color:var(--ribbon);color:var(--ribbon)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.wide{width:100%;margin-top:10px}
.icon-btn{border:0;background:none;color:var(--soft);cursor:pointer;font-size:14px;padding:4px 6px;line-height:1}
.icon-btn:hover{color:var(--ink)}
.linkish{border:0;background:none;color:var(--forest);font-size:12px;font-weight:600;cursor:pointer;
  padding:8px 0 0;text-decoration:underline;text-underline-offset:3px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.map-panel{padding:20px 24px 28px;border-right:1px solid var(--line);min-height:60vh}
.map-panel .map-wrap{max-width:560px;margin:0 auto}
.map-wrap{position:relative}
.map-svg{width:100%;height:auto;display:block;max-height:76vh}
.map-svg.picking{cursor:crosshair}

.land{fill:var(--paper2);stroke:var(--forest);stroke-width:1;stroke-opacity:.5}
.graticule line{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 5}
.grat-label{fill:var(--soft);font-size:8px;font-weight:600;opacity:.55}
.texture line{stroke:var(--contour);stroke-width:.6;opacity:.28}
.marker{cursor:pointer}
.ring{fill:none;stroke:var(--forest);stroke-width:1.4}
.dot{fill:var(--forest)}
.marker.active .ring,.marker:hover .ring{stroke:var(--ribbon);stroke-width:1.7}
.marker.active .dot,.marker:hover .dot{fill:var(--ribbon)}
.mlabel{font-size:12px;font-weight:700;letter-spacing:-.03em;fill:var(--ink);opacity:0;
  paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.marker.shown .mlabel,.marker:hover .mlabel,.marker.active .mlabel{opacity:1}
.over{font-size:9px;font-weight:600;fill:var(--soft)}
.pin circle{fill:var(--ribbon)}
.pin .pin-halo{fill:none;stroke:var(--ribbon);stroke-width:1.5;opacity:.5}
.pick-hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);font-size:11px;font-weight:600;padding:5px 12px;border-radius:2px}
.legend{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--soft);
  border-top:1px dashed var(--line);padding-top:12px}
.legend-swatch{flex:none;line-height:0}

.side{padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:23px;font-weight:700;line-height:1.1;letter-spacing:-.04em}
.stats span{font-size:11px;font-weight:500;color:var(--soft)}
.everest{font-size:11px;color:var(--soft)}

.detail{border:1px solid var(--ink);background:var(--card);padding:14px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.detail h3{font-size:17px}
.visits{list-style:none;margin:12px 0 0;padding:0;border-top:1px dashed var(--line)}
.visits li{padding:9px 0;border-bottom:1px dashed var(--line)}
.visit-line{display:flex;align-items:baseline;gap:10px;cursor:pointer;font-size:13px}
.visit-line:hover .vcourse{color:var(--ribbon)}
.vdate{font-size:11px;color:var(--soft);flex:none}
.vcourse{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtag{font-size:11px;color:var(--soft);flex:none}
.strip{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.strip-thumb{flex:none;border:0;padding:0;background:none;cursor:pointer;line-height:0}
.strip-thumb img{width:54px;height:54px;object-fit:cover;border:1px solid var(--line)}
.strip-thumb:hover img{border-color:var(--ribbon)}

.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 0;font-size:13px;font-weight:600;color:var(--soft);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ribbon)}

.list{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
  border-bottom:1px dashed var(--line);padding:11px 2px;cursor:pointer;font-size:14px;color:var(--ink)}
.row:hover{background:var(--card)}
.row.on{background:var(--ribbon-bg)}
.row-name{flex:1;font-weight:600}
.row-elev{font-size:11px;color:var(--soft)}
.count{flex:none;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;font-weight:600;
  border:1px solid var(--line);border-radius:999px;color:var(--forest);background:var(--card)}
.row.on .count{border-color:var(--ribbon);color:var(--ribbon)}
.row-thumb{width:42px;height:42px;object-fit:cover;flex:none;border:1px solid var(--line)}
.row-thumb.blank{display:block;background:var(--card)}
.row-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.row-body b{font-weight:600}
.row-body em{font-style:normal;font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-date{font-size:11px;color:var(--soft);flex:none}
.empty{text-align:center;padding:34px 12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty p{font-size:15px;font-weight:600}
.empty p.sub{font-size:12px;font-weight:500}

.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px 0}
.wall-cell{position:relative;border:0;padding:0;background:none;cursor:pointer;aspect-ratio:1;overflow:hidden}
.wall-cell img{width:100%;height:100%;object-fit:cover;display:block}
.wall-cap{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:600;color:#fff;
  padding:12px 5px 4px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.6))}

.scrim{position:fixed;inset:0;background:rgba(22,34,27,.42);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;
  border:1px solid var(--ink);box-shadow:0 18px 50px rgba(22,34,27,.22)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:17px}
.sheet-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.foot-right{display:flex;gap:8px;margin-left:auto}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.grow{flex:1}
.fld>span{font-size:11px;font-weight:600;color:var(--soft);letter-spacing:.03em}
.fld input,.fld textarea,.fld select{font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:2px;padding:9px 11px;width:100%;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 2px rgba(63,107,78,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meta-line{font-size:12px;color:var(--soft);margin-top:-8px}

.search{position:relative}
.sugg{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:3;margin:0;padding:0;list-style:none;
  background:var(--card);border:1px solid var(--ink);max-height:240px;overflow-y:auto;box-shadow:0 8px 22px rgba(22,34,27,.16)}
.sugg li{display:flex;align-items:baseline;gap:8px;padding:9px 11px;cursor:pointer;font-size:13px;border-bottom:1px dashed var(--line)}
.sugg li:last-child{border-bottom:0}
.sugg li.on{background:var(--ribbon-bg)}
.sugg li b{font-weight:600}
.sugg li span{font-size:11px;color:var(--soft)}
.sugg li em{font-style:normal;font-size:11px;color:var(--soft);margin-left:auto}

.newbox{border:1px dashed var(--contour);background:var(--card);padding:12px}
.newbox-title{font-size:12px;color:var(--forest);font-weight:600;margin-bottom:10px}
.newbox-row{display:flex;align-items:flex-end;gap:10px}
.fld.small{width:120px;flex:none}
.mini-map{margin-top:10px;display:flex;justify-content:center}
.mini-map .map-svg{height:280px;width:auto;max-height:none}

.photo-grid{display:flex;flex-wrap:wrap;gap:6px}
.photo-cell{position:relative;line-height:0}
.photo-cell img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line)}
.photo-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:999px;border:1px solid var(--ink);
  background:var(--paper);color:var(--ink);font-size:10px;cursor:pointer;line-height:1}
.photo-x:hover{background:var(--ribbon);border-color:var(--ribbon);color:#fff}
.photo-add{width:72px;height:72px;border:1px dashed var(--contour);background:var(--card);cursor:pointer;
  color:var(--forest);font-size:11px;font-weight:600}
.photo-add:hover{border-color:var(--forest)}
.err{font-size:11px;color:var(--ribbon);display:flex;flex-direction:column;gap:2px}

.viewer{position:fixed;inset:0;background:rgba(16,22,18,.93);z-index:40;display:grid;place-items:center;padding:24px}
.viewer-fig{margin:0;max-width:min(1000px,92vw);display:flex;flex-direction:column;gap:12px}
.viewer-fig img{max-width:100%;max-height:76vh;object-fit:contain;display:block;margin:0 auto}
.viewer-load{color:#9AA79E;font-size:13px;padding:60px;text-align:center}
.viewer-fig figcaption{display:flex;align-items:baseline;gap:10px;color:#E6EAE4;font-size:12px;flex-wrap:wrap}
.viewer-fig figcaption b{font-size:15px;font-weight:700;letter-spacing:-.03em}
.viewer-fig figcaption em{font-style:normal;color:#9AA79E}
.viewer-fig figcaption .idx{margin-left:auto;color:#9AA79E}
.viewer-close{position:absolute;top:16px;right:20px;border:0;background:none;color:#E6EAE4;font-size:18px;cursor:pointer}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:none;color:#E6EAE4;
  font-size:44px;line-height:1;cursor:pointer;padding:0 18px;opacity:.6}
.viewer-nav:hover{opacity:1}
.viewer-nav.left{left:4px}
.viewer-nav.right{right:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;background:var(--ink);
  color:var(--paper);font-size:12px;font-weight:500;padding:10px 16px;border-radius:2px;max-width:80vw}
.storage-note{font-size:11px;color:var(--soft);border-top:1px dashed var(--line);padding-top:10px;line-height:1.6}

:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}

@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .map-panel{border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .side{padding:16px 16px 60px}
  .topbar{padding:12px 16px}
  .brand h1{font-size:19px}
  .list{max-height:none}
  .newbox-row{flex-direction:column;align-items:stretch}
  .fld.small{width:100%}
  .btn{padding:11px 14px}
  .map-svg{max-height:64vh}
  .sheet{max-height:96vh}
  .fld input,.fld textarea,.fld select{font-size:16px}
  .wall{grid-template-columns:repeat(3,1fr)}
  .viewer-nav{font-size:36px;padding:0 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>산행 기록</h1>
    <p class="sub num" id="headSub">산 0 · 산행 0</p>
  </div>
  <div class="top-actions">
    <button class="btn ghost" id="btnRestore">복원</button>
    <button class="btn ghost" id="btnBackup">백업</button>
    <button class="btn solid" id="btnAdd">기록 추가</button>
  </div>
</header>

<main class="grid">
  <section class="map-panel">
    <div id="mapHost"></div>
    <p class="legend">
      <span class="legend-swatch" aria-hidden="true">
        <svg viewBox="0 0 44 24" width="44" height="24">
          <circle cx="22" cy="12" r="4.5" class="ring" style="opacity:.3"></circle>
          <circle cx="22" cy="12" r="8" class="ring" style="opacity:.45"></circle>
          <circle cx="22" cy="12" r="11.5" class="ring" style="opacity:.6"></circle>
          <circle cx="22" cy="12" r="3.4" class="dot"></circle>
        </svg>
      </span>
      등고선 한 겹이 방문 한 번입니다. 자주 오른 산일수록 크게 부풀어 오릅니다.
    </p>
  </section>

  <aside class="side">
    <div class="stats" id="stats"></div>
    <p class="everest num" id="everest"></p>
    <div id="detailHost"></div>
    <div class="tabs">
      <button data-tab="summits" class="on">산 목록</button>
      <button data-tab="log">산행 일지</button>
      <button data-tab="photos">사진</button>
    </div>
    <div class="list" id="listHost"></div>
    <p class="storage-note" id="storageNote"></p>
  </aside>
</main>

<div id="formHost"></div>
<div id="viewerHost"></div>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>

const proj=(lat,lng)=>({x:(lng-124.5)*82+10, y:(38.8-lat)*103.4+8});
const unproj=(x,y)=>({lat:38.8-(y-8)/103.4, lng:(x-10)/82+124.5});

function smoothPath(pts){
  const p=pts.map(a=>proj(a[0],a[1])), n=p.length;
  let d="M "+p[0].x.toFixed(1)+" "+p[0].y.toFixed(1);
  for(let i=0;i<n;i++){
    const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6};
    const c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};
    d+=" C "+c1.x.toFixed(1)+" "+c1.y.toFixed(1)+", "+c2.x.toFixed(1)+" "+c2.y.toFixed(1)+", "+p2.x.toFixed(1)+" "+p2.y.toFixed(1);
  }
  return d+" Z";
}

/* ─── 저장소: IndexedDB 우선, 안 되면 localStorage ─── */
let idb=null, storeMode="local";
function openDB(){
  return new Promise(res=>{
    let done=false; const finish=()=>{if(!done){done=true;res();}};
    try{
      const req=indexedDB.open("hikelog",1);
      req.onupgradeneeded=()=>{ req.result.createObjectStore("kv"); };
      req.onsuccess=()=>{ idb=req.result; storeMode="idb"; finish(); };
      req.onerror=finish; req.onblocked=finish;
      setTimeout(finish,2000);
    }catch(e){ finish(); }
  });
}
function idbReq(mode,fn){
  return new Promise((res,rej)=>{
    const tx=idb.transaction("kv",mode), st=tx.objectStore("kv"), r=fn(st);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
const Store={
  async get(k){ if(idb) return await idbReq("readonly",st=>st.get(k)); return localStorage.getItem(k); },
  async set(k,v){ if(idb) return await idbReq("readwrite",st=>st.put(v,k)); localStorage.setItem(k,v); },
  async del(k){ if(idb) return await idbReq("readwrite",st=>st.delete(k)); localStorage.removeItem(k); }
};

/* ─── 사진 ─── */
function readAsDataURL(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=()=>rej(new Error("파일을 읽지 못했습니다"));
    fr.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error("이 형식은 브라우저에서 열 수 없습니다"));
    img.src=src;
  });
}
function shrink(img,maxSide,q){
  const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(img.width*scale));
  c.height=Math.max(1,Math.round(img.height*scale));
  const ctx=c.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}
async function processPhoto(file){
  const raw=await readAsDataURL(file);
  const img=await loadImage(raw);
  const bigSide=storeMode==="idb"?1600:900, bigQ=storeMode==="idb"?0.8:0.68;
  let full,thumb;
  try{ full=shrink(img,bigSide,bigQ); thumb=shrink(img,320,0.58); }
  catch(e){ full=raw; thumb=raw; }
  return {pid:uid(), full:full, thumb:thumb};
}

function summitList(){
  const M=allMountains(), g=new Map();
  S.hikes.forEach(h=>{
    const m=M.get(h.name); if(!m) return;
    if(!g.has(h.name)) g.set(h.name,Object.assign({},m,{count:0,visits:[]}));
    const e=g.get(h.name); e.count++; e.visits.push(h);
  });
  g.forEach(v=>v.visits.sort((a,b)=>b.date.localeCompare(a.date)));
  return [...g.values()].sort((a,b)=>b.count-a.count||b.elev-a.elev);
}
function timeline(){ return S.hikes.slice().sort((a,b)=>b.date.localeCompare(a.date)); }
function photoItems(){
  const out=[];
  timeline().forEach(h=>(h.photos||[]).forEach(pid=>out.push({pid:pid,name:h.name,date:h.date,course:h.course})));

}

  }
  let g="";
  [34,35,36,37,38].forEach(la=>{
    const y=proj(la,0).y;
    g+='<line x1="8" x2="'+(VW-8)+'" y1="'+y+'" y2="'+y+'"></line><text x="12" y="'+(y-4)+'" class="grat-label">'+la+'°N</text>';
  });
  [126,127,128,129].forEach(ln=>{
    const x=proj(0,ln).x;
    g+='<line y1="8" y2="'+(VH-8)+'" x1="'+x+'" x2="'+x+'"></line><text y="'+(VH-12)+'" x="'+(x+4)+'" class="grat-label">'+ln+'°E</text>';
  });
  let tex="";
  for(let i=0;i<26;i++) tex+='<line x1="0" x2="'+VW+'" y1="'+(i*24+6)+'" y2="'+(i*24+6)+'"></line>';

  let mk="";
  summits.forEach(s=>{
    const p=proj(s.lat,s.lng), rings=Math.min(s.count,5);
    let rc="";
    for(let i=0;i<rings;i++) rc+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(5+i*3.6)+'" class="ring" style="opacity:'+(0.28+i*0.13)+'"></circle>';
    mk+='<g class="marker'+(selected===s.name?" active":"")+(shown.has(s.name)?" shown":"")+'" data-mtn="'+esc(s.name)+'">'
      + '<circle cx="'+p.x+'" cy="'+p.y+'" r="22" fill="transparent"></circle>'+rc
      + '<circle cx="'+p.x+'" cy="'+p.y+'" r="3.4" class="dot"></circle>'
      + (s.count>5?'<text x="'+(p.x+22)+'" y="'+(p.y+4)+'" class="over">×'+s.count+'</text>':"")
      + '<text x="'+p.x+'" y="'+(p.y-(5+rings*3.6)-7)+'" class="mlabel" text-anchor="middle">'+esc(s.name)+'</text></g>';
  });
  let pinEl="";
  if(pin){
    const p=proj(pin.lat,pin.lng);
    pinEl='<g class="pin"><circle cx="'+p.x+'" cy="'+p.y+'" r="7"></circle><circle cx="'+p.x+'" cy="'+p.y+'" r="14" class="pin-halo"></circle></g>';
  }
  const jeju=proj(33.38,126.55);
  const clipId="lc"+(compact?"m":"a");
  return '<div class="map-wrap">'
    + '<svg viewBox="0 0 '+VW+' '+VH+'" class="map-svg'+(pick?" picking":"")+'" role="img" aria-label="다녀온 산 지도">'
    + '<defs><clipPath id="'+clipId+'"><path d="'+LAND+'"></path></clipPath></defs>'
    + '<g class="graticule">'+g+'</g>'
    + '<path d="'+LAND+'" class="land"></path>'
    + '<ellipse cx="'+jeju.x+'" cy="'+jeju.y+'" rx="30" ry="15" class="land"></ellipse>'
    + '<g clip-path="url(#'+clipId+')" class="texture">'+tex+'</g>'
    + mk + pinEl + '</svg>'
    + (pick?'<div class="pick-hint">지도를 눌러 위치를 옮기세요</div>':"")
    + '</div>';
}

function wireForm(){
  const name=document.getElementById("fName"), sugg=document.getElementById("sugg");
  let cursor=0;
  const matches=()=>{
    const q=name.value.trim(); if(!q) return [];
    const M=[...allMountains().values()];
    if(M.some(m=>m.name===q)) return [];
    const a=[],b=[];
    M.forEach(m=>{ if(m.name.indexOf(q)===0) a.push(m); else if(m.name.indexOf(q)>=0||(m.region||"").indexOf(q)>=0) b.push(m); });
    return a.concat(b).slice(0,7);
  };
  const paint=()=>{
    const ms=matches();
    if(!ms.length){ sugg.hidden=true; sugg.innerHTML=""; return; }
    sugg.hidden=false;
    sugg.innerHTML=ms.map((m,i)=>'<li class="'+(i===cursor?"on":"")+'" data-pick="'+esc(m.name)+'"><b>'+esc(m.name)+'</b>'
      +'<span class="num">'+(m.elev?nf(m.elev)+"m":"")+'</span><em>'+esc(m.region)+'</em></li>').join("");
  };
  name.addEventListener("input",()=>{ D.name=name.value; D.lat=null; D.lng=null; D.region=""; D.fine=false; cursor=0; paint(); refreshName(); });
  name.addEventListener("focus",paint);
  name.addEventListener("blur",()=>setTimeout(()=>{sugg.hidden=true;},140));
  name.addEventListener("keydown",e=>{
    const ms=matches(); if(!ms.length) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); cursor=Math.min(cursor+1,ms.length-1); paint(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); cursor=Math.max(cursor-1,0); paint(); }
    if(e.key==="Enter"){ e.preventDefault(); pickName(ms[cursor].name); }
  });
  sugg.addEventListener("mousedown",e=>{
    const li=e.target.closest("[data-pick]"); if(!li) return;
    e.preventDefault(); pickName(li.dataset.pick);
  });

  document.getElementById("fRegion").addEventListener("change",e=>{
    const r=REGIONS.find(x=>x[0]===e.target.value);
    if(!r){ D.region=""; D.lat=null; D.lng=null; }
    else { const j=jitter(D.name); D.region=r[0]; D.lat=r[1]+j.dLat; D.lng=r[2]+j.dLng; }
    refreshName();
  });
  document.getElementById("fElev").addEventListener("input",e=>{ D.elev=e.target.value; });
  document.getElementById("fFine").addEventListener("click",()=>{ D.fine=!D.fine; refreshName(); });
  document.getElementById("fMap").addEventListener("click",e=>{
    const svg=e.target.closest("svg.map-svg"); if(!svg) return;
    const r=svg.getBoundingClientRect();
    const p=unproj((e.clientX-r.left)/r.width*VW,(e.clientY-r.top)/r.height*VH);
    D.lat=p.lat; D.lng=p.lng; refreshName();
  });

  const grid=document.getElementById("fPhotos"), file=document.getElementById("fFile");
  grid.addEventListener("click",e=>{
    const add=e.target.closest("[data-add]"); if(add){ file.click(); return; }
    const x=e.target.closest("[data-drop]");
    if(x){
      const pid=x.dataset.drop;
      D.photos=D.photos.filter(p=>p!==pid);
      D.newPhotos=D.newPhotos.filter(p=>p.pid!==pid);
      drawPhotos();
    }
  });
  grid.addEventListener("dragover",e=>e.preventDefault());
  grid.addEventListener("drop",e=>{ e.preventDefault(); addFiles(e.dataTransfer.files); });
  file.addEventListener("change",e=>{ addFiles(e.target.files); e.target.value=""; });

  document.getElementById("fSave").addEventListener("click",saveDraft);
}

function pickName(n){
  D.name=n; D.lat=null; D.lng=null; D.region=""; D.fine=false;
  document.getElementById("fName").value=n;
  document.getElementById("sugg").hidden=true;
  refreshName();
}

function refreshName(){
  const known=lookup(D.name), isNew=D.name.trim()&&!known;
  const meta=document.getElementById("fMeta"), box=document.getElementById("fNew");
  if(known){
    meta.hidden=false;
    meta.textContent=(known.elev?nf(known.elev)+"m · ":"")+known.region+" · "+known.lat.toFixed(3)+", "+known.lng.toFixed(3);
  } else meta.hidden=true;
  box.hidden=!isNew;
  const fine=document.getElementById("fFine"), fmap=document.getElementById("fMap");
  if(isNew){
    document.getElementById("fRegion").value=D.region||"";
    fine.hidden=!D.lat;
    fine.textContent=D.fine?"지도 접기":"지도에서 위치 다듬기";
    fmap.innerHTML=(D.fine&&D.lat)?'<div class="mini-map">'+mapSVG({summits:[],pick:true,compact:true,pin:{lat:D.lat,lng:D.lng}})+'</div>':"";
  }
  const ok=D.name.trim()&&document.getElementById("fDate").value&&(known||(D.lat&&D.lng));
  document.getElementById("fSave").disabled=!ok;
}

function drawPhotos(){
  const grid=document.getElementById("fPhotos");
  if(!grid) return;
  const cells=D.photos.map(pid=>({pid:pid,src:S.thumbs[pid]}))
    .concat(D.newPhotos.map(p=>({pid:p.pid,src:p.thumb})));
  grid.innerHTML=cells.map(c=>'<div class="photo-cell"><img src="'+(c.src||"")+'" alt="">'
    +'<button class="photo-x" data-drop="'+c.pid+'">✕</button></div>').join("")
    +'<button type="button" class="photo-add" data-add="1">+ 사진</button>';
}

async function addFiles(list){
  const files=[].filter.call(list||[],f=>f.type.indexOf("image/")===0);
  const errBox=document.getElementById("fErr");
  if(!files.length){ errBox.innerHTML="<p>이미지 파일만 넣을 수 있습니다.</p>"; return; }
  errBox.innerHTML="";
  const btn=document.querySelector(".photo-add"); if(btn) btn.textContent="처리 중";
  const bad=[];
  for(const f of files){
    try{ D.newPhotos.push(await processPhoto(f)); }
    catch(e){ bad.push(f.name+" — "+e.message); }
  }
  drawPhotos();
  if(bad.length) errBox.innerHTML=bad.map(m=>"<p>"+esc(m)+"</p>").join("");
}

async function saveDraft(){
  const name=document.getElementById("fName").value.trim();
  const date=document.getElementById("fDate").value;
  if(!name||!date) return;
  const M=allMountains();
  if(!M.has(name)){
    S.customs.push({name:name,elev:Number(D.elev)||0,lat:D.lat,lng:D.lng,region:D.region||"직접 등록"});
  }
  const prev=S.hikes.find(h=>h.id===D.id);
  const removed=((prev&&prev.photos)||[]).filter(p=>D.photos.indexOf(p)<0);
  const photoIds=D.photos.concat(D.newPhotos.map(p=>p.pid));

  removed.forEach(pid=>{ delete S.thumbs[pid]; });
  D.newPhotos.forEach(p=>{ S.thumbs[p.pid]=p.thumb; });

  try{
    for(const p of D.newPhotos) await Store.set(K_PHOTO(p.pid),p.full);
    for(const pid of removed) await Store.del(K_PHOTO(pid));
  }catch(e){ toast("사진 저장에 실패했습니다. 저장 공간이 찼을 수 있습니다."); }
  await saveThumbs();

  const rec={id:D.id||uid(),name:name,course:document.getElementById("fCourse").value.trim(),date:date,
    hours:document.getElementById("fHours").value.trim(),buddy:document.getElementById("fBuddy").value.trim(),
    note:document.getElementById("fNote").value.trim(),photos:photoIds};
  if(D.id) S.hikes=S.hikes.map(h=>h.id===D.id?rec:h); else S.hikes.push(rec);
  S.selected=name;
  await saveData();
  closeForm(); render();
}

async function deleteDraft(){
  if(!D||!D.id) return;
  if(!confirm("이 기록을 지울까요? 함께 넣은 사진도 사라집니다.")) return;
  const t=S.hikes.find(h=>h.id===D.id), pids=(t&&t.photos)||[];
  pids.forEach(pid=>{ delete S.thumbs[pid]; });
  try{ for(const pid of pids) await Store.del(K_PHOTO(pid)); }catch(e){}
  await saveThumbs();
  S.hikes=S.hikes.filter(h=>h.id!==D.id);
  await saveData();
  closeForm(); render();
}

/* ─── 백업 / 복원 ─── */
async function backup(){
  toast("백업 파일을 만드는 중입니다…");
  const photos={};
  for(const pid of Object.keys(S.thumbs)){
    let full=null;
    try{ full=await Store.get(K_PHOTO(pid)); }catch(e){}
    photos[pid]={thumb:S.thumbs[pid],full:full||S.thumbs[pid]};
  }
  const payload={format:"hikelog",version:1,exportedAt:new Date().toISOString(),
    hikes:S.hikes,customs:S.customs,photos:photos};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="산행기록_백업_"+todayStr()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("백업 파일을 내려받았습니다.");
}

async function restore(file){
  let data;
  try{ data=JSON.parse(await file.text()); }
  catch(e){ toast("백업 파일을 읽지 못했습니다."); return; }
  if(!data||!Array.isArray(data.hikes)){ toast("산행 기록 백업 파일이 아닙니다."); return; }
  if(!confirm("지금 기록을 모두 지우고 백업 내용으로 되돌립니다. 계속할까요?")) return;

  S.hikes=data.hikes; S.customs=data.customs||[]; S.thumbs={};
  const photos=data.photos||{};
  try{
    for(const pid of Object.keys(photos)){
      S.thumbs[pid]=photos[pid].thumb;
      if(photos[pid].full) await Store.set(K_PHOTO(pid),photos[pid].full);
    }
  }catch(e){ toast("사진 일부를 복원하지 못했습니다. 저장 공간이 부족할 수 있습니다."); }
  await saveThumbs(); await saveData();
  S.selected=null; render();
  toast("복원했습니다. 산행 "+S.hikes.length+"건.");
}

/* ─── 이벤트 ─── */
document.addEventListener("click",e=>{
  const t=e.target;

  if(t.closest("#btnAdd")||t.closest('[data-act="add"]')){ openForm(); return; }
  if(t.closest("#btnBackup")){ backup(); return; }
  if(t.closest("#btnRestore")){ document.getElementById("restoreInput").click(); return; }

  const tab=t.closest("[data-tab]");
  if(tab){ S.tab=tab.dataset.tab; render(); return; }

  const mk=t.closest("[data-mtn]");
  if(mk){ S.selected=(S.selected===mk.dataset.mtn)?null:mk.dataset.mtn; render(); return; }

  const selBtn=t.closest("[data-select]");
  if(selBtn){ S.selected=selBtn.dataset.select; render(); return; }

  if(t.closest('[data-act="deselect"]')){ S.selected=null; render(); return; }

  const again=t.closest("[data-again]");
  if(again){ openForm({name:again.dataset.again}); return; }

  const ed=t.closest("[data-edit]");
  if(ed){
    const h=S.hikes.find(x=>x.id===ed.dataset.edit);
    if(h) openForm(Object.assign({},h,{photos:(h.photos||[]).slice(),newPhotos:[],elev:"",region:"",fine:false}));
    return;
  }

  const pv=t.closest("[data-photo-visit]");
  if(pv){
    const h=S.hikes.find(x=>x.id===pv.dataset.photoVisit);
    if(h){
      const items=(h.photos||[]).map(pid=>({pid:pid,name:h.name,date:h.date,course:h.course}));
      openViewer(items,Number(pv.dataset.i)||0);
    }
    return;
  }
  const pa=t.closest("[data-photo-all]");
  if(pa){ openViewer(photoItems(),Number(pa.dataset.photoAll)||0); return; }

  const nav=t.closest("[data-nav]");
  if(nav&&VIEW){
    VIEW.index=Math.max(0,Math.min(VIEW.items.length-1,VIEW.index+Number(nav.dataset.nav)));
    drawViewer(); return;
  }
  if(t.closest('[data-act="close-viewer"]')&&!t.closest("[data-stop]")){ closeViewer(); return; }
  if(t.closest('[data-act="delete"]')){ deleteDraft(); return; }
  if(t.closest('[data-act="close-form"]')){ closeForm(); return; }
  if(t.closest('[data-act="scrim-close"]')&&!t.closest("[data-stop]")){ closeForm(); return; }

  // 지도 빈 곳 클릭 → 선택 해제
  if(t.closest("#mapHost svg")&&!mk){ if(S.selected){ S.selected=null; render(); } }
});

document.addEventListener("keydown",e=>{
  if(VIEW){
    if(e.key==="Escape") closeViewer();
    if(e.key==="ArrowRight"&&VIEW.index<VIEW.items.length-1){ VIEW.index++; drawViewer(); }
    if(e.key==="ArrowLeft"&&VIEW.index>0){ VIEW.index--; drawViewer(); }
    return;
  }
  if(D&&e.key==="Escape") closeForm();
});

document.addEventListener("change",e=>{
  if(e.target.id==="fDate"&&D) refreshName();
  if(e.target.id==="restoreInput"&&e.target.files[0]){
    restore(e.target.files[0]); e.target.value="";
  }
});

/* ─── 시작 ─── */
(async function init(){
  await openDB();
  try{ const raw=await Store.get(K_DATA); if(raw){ const v=JSON.parse(raw); S.hikes=v.hikes||[]; S.customs=v.customs||[]; } }catch(e){}
  try{ const t=await Store.get(K_THUMBS); if(t) S.thumbs=JSON.parse(t)||{}; }catch(e){}
  render();
})();
</script>
</body>
</html>
