<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="산행일지">
<title>산행일지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --surface-2:#FAFBF9;
  --ink:#18261E; --soft:#6E7C73; --faint:#98A69D;
  --line:#E6EBE3; --line-2:#EFF3ED;
  --green:#2E6B4A; --green-d:#245239; --green-soft:#EAF2EA; --green-mid:#7FA98C;
  --land:#E3EDE2; --land-2:#D6E4D6;
  --danger:#C8503F;
  --r-lg:10px; --r:8px; --r-s:6px;
  --sh:0 1px 3px rgba(24,38,30,.05);
  --sh-md:0 4px 14px rgba(24,38,30,.08);
  --sh-lg:0 14px 40px rgba(24,38,30,.16);
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;font-family:var(--sans)}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:800;margin:0;letter-spacing:-.04em}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.sub{color:var(--soft);font-size:13px;font-weight:500}
[hidden]{display:none !important}

/* 헤더 */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding:20px 20px 14px;position:sticky;top:0;z-index:5;
  background:rgba(244,246,242,.88);backdrop-filter:saturate(180%) blur(12px)}
.brand h1{font-size:26px;letter-spacing:.34em;margin-right:-.34em;font-weight:800}
.brand .sub{margin-top:5px}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}

/* 페이지 전환 */
.nav{display:flex;gap:3px;background:var(--surface);border-radius:9px;padding:3px;
  margin:0 20px 4px;box-shadow:var(--sh);max-width:1280px;margin-left:auto;margin-right:auto;
  width:calc(100% - 40px)}
.nav button{flex:1;border:0;background:none;padding:11px 20px;font-size:14px;font-weight:700;
  color:var(--soft);cursor:pointer;border-radius:7px;letter-spacing:-.02em;transition:.16s}
.nav button.on{background:var(--green);color:#fff}

/* 버튼 */
.btn{font-size:14px;font-weight:700;padding:11px 18px;border-radius:var(--r-s);
  border:1px solid transparent;background:var(--surface);color:var(--ink);cursor:pointer;
  transition:.16s;letter-spacing:-.02em;box-shadow:var(--sh)}
.btn.solid{background:var(--green);color:#fff}
.btn.solid:hover{background:var(--green-d)}
.btn.ghost{background:var(--surface);color:var(--soft);border-color:var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:var(--faint)}
.btn.danger{color:var(--danger);border-color:var(--line);box-shadow:none;background:none}
.btn.danger:hover{background:#FBF0EE;border-color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%;margin-top:12px}
.iconbtn{width:44px;height:44px;border:0;background:var(--surface);color:var(--soft);
  font-size:18px;cursor:pointer;border-radius:var(--r);line-height:1;padding:0;
  box-shadow:var(--sh);transition:.16s;display:grid;place-items:center}
.iconbtn:hover{color:var(--ink)}
.iconbtn.solid{background:var(--green);color:#fff;font-size:26px;font-weight:300}
.iconbtn.solid:hover{background:var(--green-d)}
.icon-btn{border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px;
  padding:6px;line-height:1;border-radius:5px}
.icon-btn:hover{color:var(--ink);background:var(--line-2)}
.linkish{border:0;background:none;color:var(--green);font-size:12px;font-weight:700;
  cursor:pointer;padding:10px 0 0}

/* 레이아웃 */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;
  padding:12px 20px 40px;max-width:1320px;margin:0 auto;align-items:start}
.map-panel{background:var(--surface);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh)}
.map-panel .map-wrap{max-width:600px;margin:0 auto}
.map-wrap{position:relative}
.map-svg{width:100%;height:auto;display:block;max-height:74vh}
.map-svg.picking{cursor:crosshair}
.map-svg.zoomable{touch-action:pan-y;cursor:grab}
.map-svg.zoomable:active{cursor:grabbing}

/* 권역 전환 */
.regions{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;
  scrollbar-width:none;-ms-overflow-style:none}
.regions::-webkit-scrollbar{display:none}
.regions button{flex:none;border:1px solid var(--line);background:var(--surface);
  color:var(--soft);font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;
  cursor:pointer;transition:.15s;letter-spacing:-.02em}
.regions button:hover{color:var(--ink);border-color:var(--faint)}
.regions button.on{background:var(--green-soft);border-color:var(--green-soft);color:var(--green)}

/* 지도 */
.land{fill:var(--land);stroke:#fff;stroke-width:.7;stroke-linejoin:round;transition:fill .2s}
.land-on{fill:#C9DFC8}
.land-off{fill:#EBF1E9}
.marker{cursor:pointer}
.ring{fill:none;stroke:var(--green-mid);stroke-width:1.6}
.dot{fill:var(--green)}
.marker.active .ring,.marker:hover .ring{stroke:var(--green)}
.marker.active .dot,.marker:hover .dot{fill:var(--green-d)}
.mlabel-g{opacity:0;pointer-events:none;transition:opacity .14s}
.marker.shown .mlabel-g,.marker:hover .mlabel-g,.marker.active .mlabel-g{opacity:1}
.mlabel-bg{fill:#fff;filter:url(#lblShadow)}
.mlabel-name{font-size:12px;font-weight:700;fill:var(--ink);letter-spacing:-.03em}
.mlabel-elev{font-size:11px;font-weight:600;fill:var(--soft)}
.over{font-size:9px;font-weight:700;fill:var(--soft)}
.pin circle{fill:var(--green)}
.pin .pin-halo{fill:none;stroke:var(--green);stroke-width:1.5;opacity:.45}
.pick-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:12px;font-weight:600;padding:7px 14px;border-radius:6px}
.mz-ctrl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.mz-ctrl button{width:38px;height:38px;border:0;background:var(--surface);color:var(--soft);
  font-size:18px;line-height:1;cursor:pointer;padding:0;border-radius:8px;box-shadow:var(--sh-md)}
.mz-ctrl button:hover{color:var(--green)}
.legend{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--faint);
  padding:0 4px}
.legend-swatch{flex:none;line-height:0}

/* 대표 산 카드 */
.feature{position:relative;background:var(--surface);border-radius:var(--r);padding:16px 18px;
  box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:.16s;min-height:84px}
.feature:hover{box-shadow:var(--sh-md)}
.feature-label{font-size:12px;font-weight:600;color:var(--soft);position:relative;z-index:1}
.feature-main{margin-top:7px;display:flex;align-items:baseline;gap:9px;
  flex-wrap:wrap;position:relative;z-index:1}
.feature-main b{font-size:20px;font-weight:800;letter-spacing:-.045em}
.feature-main span{font-size:13px;font-weight:600;color:var(--soft)}
.feature-art{position:absolute;right:0;bottom:0;height:72%;width:auto;pointer-events:none;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 34%);
  mask-image:linear-gradient(to right,transparent,#000 34%)}

/* 사이드 */
.side{display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--surface);border-radius:var(--r);padding:14px 16px;
  display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.stats b{font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.045em}
.stats span{font-size:12px;font-weight:500;color:var(--soft)}
.everest{font-size:12px;color:var(--faint);padding:0 4px}

.detail{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-md)}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.detail h3{font-size:19px}
.detail .sub{margin-top:3px}
.visits{list-style:none;margin:14px 0 0;padding:0}
.visits li{padding:13px 0;border-top:1px solid var(--line-2)}
.visit-line{display:flex;align-items:baseline;gap:10px;cursor:pointer;font-size:14px}
.visit-line:hover .vcourse{color:var(--green)}
.vdate{font-size:12px;color:var(--soft);flex:none;font-weight:600}
.vcourse{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtag{font-size:12px;color:var(--faint);flex:none}
.vpeak{margin-top:7px;font-size:12px;font-weight:700;color:var(--green);cursor:pointer}
.vwith{display:inline-block;margin-top:9px;font-size:12px;font-weight:600;color:var(--green);
  background:var(--green-soft);padding:4px 10px;border-radius:5px;cursor:pointer}
.vnote{margin-top:9px;font-size:13px;color:var(--soft);line-height:1.7;white-space:pre-wrap;
  background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;cursor:pointer}
.strip{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.strip-thumb{flex:none;border:0;padding:0;background:none;cursor:pointer;line-height:0}
.strip-thumb img{width:60px;height:60px;object-fit:cover;border-radius:var(--r-s)}
.strip-thumb:hover img{opacity:.85}

/* 탭 · 목록 */
.tabs{display:flex;gap:6px;padding:0 2px}
.tabs button{border:0;background:none;padding:8px 14px;font-size:13px;font-weight:700;
  color:var(--soft);cursor:pointer;border-radius:6px;letter-spacing:-.02em}
.tabs button.on{background:var(--green-soft);color:var(--green)}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);
  padding:6px 16px;box-shadow:var(--sh);max-height:44vh;overflow-y:auto}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;
  border-bottom:1px solid var(--line-2);padding:14px 0;cursor:pointer;font-size:15px;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:hover .row-name,.row:hover .row-body b{color:var(--green)}
.row.on .row-name{color:var(--green)}
.row-name{flex:1;font-weight:600;letter-spacing:-.02em}
.row-elev{font-size:12px;color:var(--faint)}
.count{flex:none;min-width:30px;height:26px;display:grid;place-items:center;font-size:13px;
  font-weight:700;border-radius:6px;color:var(--green);background:var(--green-soft)}
.row.on .count{background:var(--green);color:#fff}
.row-thumb{width:46px;height:46px;object-fit:cover;flex:none;border-radius:var(--r-s)}
.row-thumb.blank{display:block;background:var(--land)}
.row-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.row-body b{font-weight:600;letter-spacing:-.02em}
.row-body em{font-style:normal;font-size:13px;color:var(--soft);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row-date{font-size:12px;color:var(--faint);flex:none}
.empty{text-align:center;padding:44px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{font-size:16px;font-weight:700;letter-spacing:-.02em}
.empty p.sub{font-size:13px;font-weight:500}

/* 갤러리 */
.gallery-page{padding:12px 20px 60px;max-width:1320px;margin:0 auto}
.gyear{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.gyear:first-child{margin-top:6px}
.gyear b{font-size:24px;font-weight:800;letter-spacing:-.05em}
.gyear span{font-size:12px;color:var(--faint);font-weight:500}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.wall-cell{position:relative;border:0;padding:0;background:none;cursor:pointer;aspect-ratio:1;
  overflow:hidden;border-radius:var(--r);box-shadow:var(--sh)}
.wall-cell img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.wall-cell:hover img{transform:scale(1.04)}
.wall-cap{position:absolute;left:0;right:0;bottom:0;font-size:12px;font-weight:700;color:#fff;
  padding:22px 10px 9px;text-align:left;letter-spacing:-.02em;
  background:linear-gradient(transparent,rgba(0,0,0,.55))}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(20,32,25,.4);display:grid;place-items:center;
  padding:16px;z-index:20;backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;display:flex;
  flex-direction:column;border-radius:var(--r-lg);box-shadow:var(--sh-lg);overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 14px;
  background:var(--bg)}
.sheet-head h2{font-size:19px}
.sheet-body{padding:4px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;
  background:var(--surface);border-top:1px solid var(--line)}
.foot-right{display:flex;gap:8px;margin-left:auto}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.grow{flex:1}
.fld>span{font-size:12px;font-weight:700;color:var(--soft);letter-spacing:-.01em}
.fld input,.fld textarea,.fld select{font-size:15px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-s);padding:12px 13px;width:100%;resize:vertical}
.fld input::placeholder,.fld textarea::placeholder{color:var(--faint)}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--green);
  box-shadow:0 0 0 3px rgba(46,107,74,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meta-line{font-size:12px;color:var(--soft);margin-top:-10px;padding-left:2px}
.hint{font-size:12px;color:var(--green);font-weight:600;line-height:1.6}
.fieldnote{font-size:12px;color:var(--faint);margin-top:-3px;line-height:1.5}
.err{font-size:12px;color:var(--danger);display:flex;flex-direction:column;gap:2px}

.search{position:relative}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:3;margin:0;padding:6px;
  list-style:none;background:var(--surface);border-radius:var(--r);max-height:250px;
  overflow-y:auto;box-shadow:var(--sh-lg)}
.sugg li{display:flex;align-items:baseline;gap:8px;padding:10px 12px;cursor:pointer;
  font-size:14px;border-radius:var(--r-s)}
.sugg li.on{background:var(--green-soft)}
.sugg li b{font-weight:600}
.sugg li span{font-size:12px;color:var(--faint)}
.sugg li em{font-style:normal;font-size:12px;color:var(--faint);margin-left:auto}

.newbox{background:var(--green-soft);border-radius:var(--r);padding:14px}
.newbox-title{font-size:12px;color:var(--green);font-weight:700;margin-bottom:12px}
.newbox-row{display:flex;align-items:flex-end;gap:10px}
.fld.small{width:130px;flex:none}
.mini-map{margin-top:12px;display:flex;justify-content:center}
.mini-map .map-svg{height:280px;width:auto;max-height:none}

.photo-grid{display:flex;flex-wrap:wrap;gap:8px}
.photo-cell{position:relative;line-height:0}
.photo-cell img{width:76px;height:76px;object-fit:cover;border-radius:var(--r-s)}
.photo-x{position:absolute;top:-5px;right:-5px;width:20px;height:20px;
  border:0;background:var(--ink);color:#fff;font-size:11px;cursor:pointer;line-height:1;border-radius:5px;
  box-shadow:var(--sh-md)}
.photo-x:hover{background:var(--danger)}
.photo-add{width:76px;height:76px;border:1px dashed var(--green-mid);background:var(--green-soft);
  cursor:pointer;color:var(--green);font-size:12px;font-weight:700;border-radius:var(--r-s)}
.photo-add:hover{border-color:var(--green)}

/* 설정 */
.set-body{display:flex;flex-direction:column;gap:14px}
.set-item{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  background:var(--surface);border-radius:var(--r);padding:14px 16px}
.set-item div{flex:1}
.set-item h3{font-size:15px;font-weight:700;margin-bottom:4px}
.set-item p{font-size:12px;color:var(--soft);line-height:1.6}
.set-item .btn{flex:none}
.storage-note{font-size:12px;color:var(--faint);line-height:1.7;padding:0 4px}
.guide{background:var(--surface);border-radius:var(--r);padding:16px}
.guide h3{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.02em;margin-bottom:14px}
.guide ol{margin:0;padding:0;list-style:none;counter-reset:g}
.guide li{counter-increment:g;padding:0 0 16px 30px;position:relative}
.guide li:last-child{padding-bottom:0}
.guide li::before{content:counter(g);position:absolute;left:0;top:0;width:20px;height:20px;
  background:var(--green-soft);border-radius:5px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--green)}
.guide li b{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.guide li p{font-size:12px;color:var(--soft);line-height:1.7}

/* 사진 보기 */
.viewer{position:fixed;inset:0;background:rgba(14,20,16,.94);z-index:40;display:grid;
  place-items:center;padding:24px;touch-action:pan-y;user-select:none}
.viewer-fig{margin:0;max-width:min(1000px,92vw);display:flex;flex-direction:column;gap:14px}
.viewer-fig img{max-width:100%;max-height:76vh;object-fit:contain;display:block;margin:0 auto;
  border-radius:var(--r);-webkit-user-drag:none;user-select:none}
.viewer-load{color:#8E9C93;font-size:13px;padding:60px;text-align:center}
.viewer-fig figcaption{display:flex;align-items:baseline;gap:10px;color:#EDF1EA;font-size:13px;
  flex-wrap:wrap}
.viewer-fig figcaption b{font-size:16px;font-weight:700;letter-spacing:-.03em}
.viewer-fig figcaption em{font-style:normal;color:#8E9C93}
.viewer-fig figcaption .idx{margin-left:auto;color:#8E9C93}
.viewer-close{position:absolute;top:18px;right:20px;border:0;background:rgba(255,255,255,.12);
  color:#fff;font-size:16px;cursor:pointer;width:38px;height:38px;border-radius:9px}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);border:0;
  background:rgba(255,255,255,.1);color:#fff;font-size:26px;line-height:1;cursor:pointer;
  width:44px;height:44px;border-radius:9px;display:grid;place-items:center}
.viewer-nav:hover{background:rgba(255,255,255,.2)}
.viewer-nav.left{left:14px}
.viewer-nav.right{right:14px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;
  background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:12px 18px;
  border-radius:8px;max-width:84vw;box-shadow:var(--sh-lg)}

:focus-visible{outline:2px solid var(--green);outline-offset:2px}

@media (max-width:900px){
  .grid{grid-template-columns:1fr;padding:8px 14px 40px;gap:12px}
  .topbar{padding:16px 16px 12px}
  .brand h1{font-size:23px;letter-spacing:.3em;margin-right:-.3em}
  .nav{width:calc(100% - 32px);margin-bottom:6px}
  .side{padding:0}
  .list{max-height:none}
  .newbox-row{flex-direction:column;align-items:stretch}
  .fld.small{width:100%}
  .gallery-page{padding:8px 14px 60px}
  .ggrid{grid-template-columns:repeat(2,1fr);gap:8px}
  .gyear b{font-size:21px}
  .map-svg{max-height:60vh}
  .sheet{max-height:94vh}
  .fld input,.fld textarea,.fld select{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>산행일지</h1>
    <p class="sub num" id="headSub">산 0 · 산행 0</p>
  </div>
  <div class="top-actions">
    <button class="iconbtn" id="btnSettings" aria-label="설정" title="설정">⚙</button>
    <button class="iconbtn solid" id="btnAdd" aria-label="산행 추가" title="산행 추가">+</button>
  </div>
</header>

<nav class="nav">
  <button data-view="map" class="on">지도</button>
  <button data-view="gallery">갤러리</button>
</nav>

<main class="grid" id="pageMap">
  <section class="map-panel">
    <div class="regions" id="regionBar"></div>

/* ─── 저장소: IndexedDB 우선, 안 되면 localStorage ─── */
let idb=null, storeMode="local";
function openDB(){
  return new Promise(res=>{
    let done=false; const finish=()=>{if(!done){done=true;res();}};
    try{
      const req=indexedDB.open("hikelog",1);
      req.onupgradeneeded=()=>{ req.result.createObjectStore("kv"); };
      req.onsuccess=()=>{ idb=req.result; storeMode="idb"; finish(); };
      req.onerror=finish; req.onblocked=finish;
      setTimeout(finish,2000);
    }catch(e){ finish(); }
  });
}
function idbReq(mode,fn){
  return new Promise((res,rej)=>{
    const tx=idb.transaction("kv",mode), st=tx.objectStore("kv"), r=fn(st);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
const Store={
  async get(k){ if(idb) return await idbReq("readonly",st=>st.get(k)); return localStorage.getItem(k); },
  async set(k,v){ if(idb) return await idbReq("readwrite",st=>st.put(v,k)); localStorage.setItem(k,v); },
  async del(k){ if(idb) return await idbReq("readwrite",st=>st.delete(k)); localStorage.removeItem(k); }
};

/* ─── 사진 ─── */
function readAsDataURL(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=()=>rej(new Error("파일을 읽지 못했습니다"));
    fr.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error("이 형식은 브라우저에서 열 수 없습니다"));
    img.src=src;
  });
}
function shrink(img,maxSide,q){
  const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(img.width*scale));
  c.height=Math.max(1,Math.round(img.height*scale));
  const ctx=c.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}
async function processPhoto(file){
  const raw=await readAsDataURL(file);
  const img=await loadImage(raw);
  const bigSide=storeMode==="idb"?1600:900, bigQ=storeMode==="idb"?0.8:0.68;
  let full,thumb;
  try{ full=shrink(img,bigSide,bigQ); thumb=shrink(img,320,0.58); }
  catch(e){ full=raw; thumb=raw; }
  return {pid:uid(), full:full, thumb:thumb};
}

/* 촬영 정보 읽기: EXIF 날짜 + GPS 좌표 */
function tiffInfo(v,start){
  const le=v.getUint16(start)===0x4949;
  const u16=o=>v.getUint16(o,le), u32=o=>v.getUint32(o,le);
  if(u16(start+2)!==0x002A) return null;
  const dirEntry=(dir,tag)=>{
    const n=u16(dir);
    for(let i=0;i<n;i++){
      const e=dir+2+i*12;
      if(u16(e)===tag) return {count:u32(e+4),valOff:e+8};
    }
    return null;
  };
  const ascii=en=>{
    const off=en.count>4?start+u32(en.valOff):en.valOff;
    let s="";
    for(let i=0;i<en.count-1;i++){
      const c=v.getUint8(off+i); if(!c) break; s+=String.fromCharCode(c);
    }
    return s;
  };
  const rationals=en=>{
    const off=start+u32(en.valOff), out=[];
    for(let i=0;i<en.count;i++){
      const n=u32(off+i*8), d=u32(off+i*8+4);
      out.push(d?n/d:0);
    }
    return out;
  };
  const ifd0=start+u32(start+4);

  let raw=null;
  const ptr=dirEntry(ifd0,0x8769);
  if(ptr){
    const sub=start+u32(ptr.valOff);
    const en=dirEntry(sub,0x9003)||dirEntry(sub,0x9004);
    if(en) raw=ascii(en);
  }
  if(!raw){ const en=dirEntry(ifd0,0x0132); if(en) raw=ascii(en); }
  const m=raw?raw.match(/^(\d{4})[:\-](\d{2})[:\-](\d{2})/):null;
  const date=m?m[1]+"-"+m[2]+"-"+m[3]:null;

  let lat=null,lng=null;
  const gp=dirEntry(ifd0,0x8825);
  if(gp){
    const g=start+u32(gp.valOff);
    const latRef=dirEntry(g,1), latE=dirEntry(g,2), lngRef=dirEntry(g,3), lngE=dirEntry(g,4);
    if(latE&&lngE&&latE.count>=3&&lngE.count>=3){
      const a=rationals(latE), b=rationals(lngE);
      lat=a[0]+a[1]/60+a[2]/3600;
      lng=b[0]+b[1]/60+b[2]/3600;
      if(latRef&&ascii(latRef).toUpperCase().indexOf("S")===0) lat=-lat;
      if(lngRef&&ascii(lngRef).toUpperCase().indexOf("W")===0) lng=-lng;
      if(!isFinite(lat)||!isFinite(lng)||(lat===0&&lng===0)){ lat=null; lng=null; }
    }
  }
  return {date:date,lat:lat,lng:lng};
}
async function exifInfo(file){
  try{
    const buf=await file.slice(0,256*1024).arrayBuffer();
    const v=new DataView(buf);
    if(v.getUint16(0)!==0xFFD8) return null;
    let off=2;
    while(off+4<v.byteLength){
      if(v.getUint8(off)!==0xFF) break;
      const marker=v.getUint8(off+1), size=v.getUint16(off+2);
      if(marker===0xDA) break;
      if(marker===0xE1&&v.getUint32(off+4)===0x45786966) return tiffInfo(v,off+10);
      off+=2+size;
    }
  }catch(e){}
  return null;
}
async function photoMeta(file){
  const ex=await exifInfo(file)||{};
  let date=ex.date?{date:ex.date,source:"exif"}:null;
  if(!date&&file.lastModified){
    const d=new Date(file.lastModified);
    if(!isNaN(d)) date={date:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),source:"file"};
  }
  return {date:date, lat:ex.lat||null, lng:ex.lng||null};
}

/* 좌표에서 가장 가까운 산 찾기 */
function distKm(la1,ln1,la2,ln2){
  const R=6371, r=Math.PI/180;
  const dLa=(la2-la1)*r, dLn=(ln2-ln1)*r;
  const a=Math.sin(dLa/2)*Math.sin(dLa/2)
    +Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLn/2)*Math.sin(dLn/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function nearestMountain(lat,lng){
  let best=null;
  allMountains().forEach(m=>{
    if(m.lat==null||m.lng==null) return;
    const d=distKm(lat,lng,m.lat,m.lng);
    if(!best||d<best.km) best={m:m,km:d};
  });
  return best;
}
function fmtKm(km){ return km<1 ? Math.round(km*1000)+"m" : km.toFixed(1)+"km"; }

function mapSVG(opts){
  const summits=opts.summits||[], selected=opts.selected, pick=!!opts.pick, pin=opts.pin, compact=!!opts.compact;
  let mk="";
  summits.forEach((s,idx)=>{
    const p=proj(s.lat,s.lng), rings=Math.min(s.count,5);
    const outer=5+(rings-1)*3.6;
    let rc="";
    for(let i=0;i<rings;i++) rc+='<circle r="'+(5+i*3.6)+'" class="ring" style="opacity:'+(0.3+i*0.14)+'"></circle>';
    const el=s.elev?nf(s.elev)+"m":"";
    const w=Math.max(58,s.name.length*13+24), h=el?38:24;
    const ly=-(outer+9);
    const label='<g class="mlabel-g" data-w="'+w+'" data-h="'+h+'" data-ly="'+ly+'" transform="translate(0,'+ly+')">'
      +'<rect class="mlabel-bg" x="'+(-w/2)+'" y="'+(-h)+'" width="'+w+'" height="'+h+'" rx="4"></rect>'
      +'<text class="mlabel-name" y="'+(-h+(el?15:16))+'" text-anchor="middle">'+esc(s.name)+'</text>'
      +(el?'<text class="mlabel-elev" y="'+(-h+29)+'" text-anchor="middle">'+el+'</text>':"")
      +'</g>';
    mk+='<g class="marker'+(selected===s.name?" active":"")+'" data-mtn="'+esc(s.name)+'" data-pri="'+(selected===s.name?0:idx+1)+'">'
      +'<g class="mglyph" data-x="'+p.x+'" data-y="'+p.y+'" transform="translate('+p.x+','+p.y+')">'
      +'<circle r="20" fill="transparent"></circle>'+rc
      +'<circle r="3.6" class="dot"></circle>'
      +(s.count>5?'<text x="'+(outer+6)+'" y="4" class="over">×'+s.count+'</text>':"")
      +label+'</g></g>';
  });

  let pinEl="";
  if(pin){
    const p=proj(pin.lat,pin.lng);
    pinEl='<g class="pin"><circle cx="'+p.x+'" cy="'+p.y+'" r="7"></circle>'
      +'<circle cx="'+p.x+'" cy="'+p.y+'" r="14" class="pin-halo"></circle></g>';
  }
  const ag=REGION_GROUP[S.region]||null;
  const body=GROUP_ORDER.map(k=>'<path d="'+MAPPATH[k]+'" class="land'
      +(ag&&ag===k?" land-on":"")+(ag&&ag!==k?" land-off":"")+'" data-g="'+k+'"></path>').join("")
    + mk + pinEl;
  const zoomable=!!opts.zoom;
  return '<div class="map-wrap">'
    + '<svg viewBox="0 0 '+VW+' '+VH+'" class="map-svg'+(pick?" picking":"")+(zoomable?" zoomable":"")+'" role="img" aria-label="다녀온 산 지도">'
    + '<defs><filter id="lblShadow" x="-30%" y="-30%" width="160%" height="180%">'
    + '<feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#18261E" flood-opacity="0.16"/></filter></defs>'
    + (zoomable?'<g id="mapZoomG">'+body+'</g>':body)
    + '</svg>'
    + (pick?'<div class="pick-hint">지도를 눌러 위치를 옮기세요</div>':"")
    + (zoomable?'<div class="mz-ctrl">'
        +'<button data-mz="in" aria-label="확대">+</button>'
        +'<button data-mz="out" aria-label="축소">−</button>'
        +'<button data-mz="reset" id="mzReset" aria-label="원래대로" hidden>⟲</button></div>':"")
    + '</div>';
}

/* ─── 지도 확대·이동 ─── */
const MZ={k:1,tx:0,ty:0,dragged:false};
function clampMZ(){
  MZ.k=Math.max(1,Math.min(8,MZ.k));
  MZ.tx=Math.min(0,Math.max(VW-VW*MZ.k,MZ.tx));
  MZ.ty=Math.min(0,Math.max(VH-VH*MZ.k,MZ.ty));
}
function applyMZ(){
  const g=document.getElementById("mapZoomG");
  if(g) g.setAttribute("transform","translate("+MZ.tx.toFixed(2)+","+MZ.ty.toFixed(2)+") scale("+MZ.k.toFixed(4)+")");
  const svg=document.querySelector("#mapHost svg.map-svg");
  if(svg) svg.style.touchAction = MZ.k>1.001 ? "none" : "pan-y";
  const inv=(1/MZ.k).toFixed(4);
  document.querySelectorAll("#mapZoomG .mglyph").forEach(el=>{
    el.setAttribute("transform","translate("+el.dataset.x+","+el.dataset.y+") scale("+inv+")");
  });
  const r=document.getElementById("mzReset");
  if(r) r.hidden = MZ.k<=1.001;
  layoutLabels();
}

/* 겹치지 않는 라벨만 골라 보여준다 */
function layoutLabels(){
  const host=document.getElementById("mapZoomG");
  if(!host) return;
  const items=[];
  host.querySelectorAll(".marker").forEach(m=>{
    const gl=m.querySelector(".mglyph"), lb=m.querySelector(".mlabel-g");
    if(!gl||!lb) return;
    const X=MZ.tx+MZ.k*(+gl.dataset.x), Y=MZ.ty+MZ.k*(+gl.dataset.y);
    const w=+lb.dataset.w, h=+lb.dataset.h, ly=+lb.dataset.ly;
    items.push({m:m,X:X,Y:Y,pri:+(m.dataset.pri||99),
      box:{x:X-w/2,y:Y+ly-h,w:w,h:h}});
  });
  items.sort((a,b)=>a.pri-b.pri);
  const placed=[], pad=3;
  items.forEach(it=>{
    const b=it.box;
    let ok = it.X>-10 && it.X<VW+10 && it.Y>-10 && it.Y<VH+10
          && b.y>2 && b.x>-6 && b.x+b.w<VW+6 && placed.length<16;
    if(ok){
      for(let i=0;i<placed.length;i++){
        const p=placed[i];
        if(!(b.x+b.w+pad<p.x || p.x+p.w+pad<b.x || b.y+b.h+pad<p.y || p.y+p.h+pad<b.y)){ ok=false; break; }
      }
    }
    it.m.classList.toggle("shown",ok);
    if(ok) placed.push(b);
  });
}

/* 권역 보기 [이름, 위도최소, 위도최대, 경도최소, 경도최대] */
const REGION_VIEWS=[
  ["전국",null],
  ["수도권",[36.95,38.15,126.10,127.85]],
  ["강원",[36.90,38.60,127.45,129.60]],
  ["충청",[35.90,37.25,125.95,128.60]],
  ["영남",[34.60,36.70,127.55,129.60]],
  ["호남",[34.15,36.10,125.90,127.95]],
  ["제주",[33.10,33.70,126.05,127.05]]
];
function renderRegions(){
  const bar=document.getElementById("regionBar");
  if(!bar) return;
  bar.innerHTML=REGION_VIEWS.map((r,i)=>
    '<button data-region="'+i+'"'+(i===S.region?' class="on"':'')+'>'+esc(r[0])+'</button>').join("");
}
function markRegion(i){
  S.region=i;
  document.querySelectorAll("#regionBar button").forEach(b=>{
    b.classList.toggle("on", +b.dataset.region===i);
  });
  const ag=REGION_GROUP[i]||null;
  document.querySelectorAll("#mapZoomG .land").forEach(p=>{
    p.classList.toggle("land-on", !!ag&&p.dataset.g===ag);
    p.classList.toggle("land-off", !!ag&&p.dataset.g!==ag);
  });
}
function gotoRegion(i){
  const r=REGION_VIEWS[i][1];
  if(!r){ MZ.k=1; MZ.tx=0; MZ.ty=0; applyMZ(); markRegion(0); return; }
  const tl=proj(r[1],r[2]), br=proj(r[0],r[3]);
  const w=br.x-tl.x, h=br.y-tl.y;
  MZ.k=Math.max(1,Math.min(8,Math.min(VW/w,VH/h)));
  MZ.tx=VW/2-MZ.k*(tl.x+w/2);
  MZ.ty=VH/2-MZ.k*(tl.y+h/2);
  clampMZ(); applyMZ(); markRegion(i);
}
function svgPoint(svg,cx,cy){
  const m=svg.getScreenCTM();
  if(!m) return {x:0,y:0};
  const p=svg.createSVGPoint(); p.x=cx; p.y=cy;
  const q=p.matrixTransform(m.inverse());
  return {x:q.x,y:q.y};
}
function zoomAt(svg,cx,cy,ratio){
  const u=svgPoint(svg,cx,cy), k0=MZ.k;
  MZ.k=k0*ratio; clampMZ();
  const r=MZ.k/k0;
  MZ.tx=u.x-r*(u.x-MZ.tx);
  MZ.ty=u.y-r*(u.y-MZ.ty);
  clampMZ(); applyMZ(); markRegion(-1);
}
function panBy(svg,dx,dy){
  const a=svgPoint(svg,0,0), b=svgPoint(svg,dx,dy);
  MZ.tx+=b.x-a.x; MZ.ty+=b.y-a.y;
  clampMZ(); applyMZ(); markRegion(-1);
}
function zoomCenter(ratio){
  const svg=document.querySelector("#mapHost svg.map-svg");
  if(!svg) return;
  const r=svg.getBoundingClientRect();
  zoomAt(svg,r.left+r.width/2,r.top+r.height/2,ratio);
}
function resetMZ(){ MZ.k=1; MZ.tx=0; MZ.ty=0; applyMZ(); markRegion(0); }

function bindMapZoom(){
  const host=document.getElementById("mapHost");
  const pts=new Map();
  let last=null, prev2=null, moved=0;
  const getSvg=e=>e.target.closest?e.target.closest("svg.map-svg"):null;

  host.addEventListener("pointerdown",e=>{
    const svg=getSvg(e); if(!svg) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ last={x:e.clientX,y:e.clientY}; moved=0; MZ.dragged=false; }
    if(pts.size===2){ last=null; prev2=null; }
  });

  host.addEventListener("pointermove",e=>{
    const svg=getSvg(e); if(!svg||!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2){
      const v=[...pts.values()], a=v[0], b=v[1];
      const dist=Math.hypot(a.x-b.x,a.y-b.y);
      const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      if(prev2&&prev2.dist>0){
        zoomAt(svg,mid.x,mid.y,dist/prev2.dist);
        panBy(svg,mid.x-prev2.mid.x,mid.y-prev2.mid.y);
      }
      prev2={dist:dist,mid:mid};
      MZ.dragged=true;
      e.preventDefault();
    } else if(last&&(e.buttons||e.pointerType==="touch")){
      const dx=e.clientX-last.x, dy=e.clientY-last.y;
      moved+=Math.abs(dx)+Math.abs(dy);
      if(MZ.k>1.001){
        panBy(svg,dx,dy);
        if(moved>8) MZ.dragged=true;
        e.preventDefault();
      }
      last={x:e.clientX,y:e.clientY};
    }
  },{passive:false});

  const end=e=>{
    pts.delete(e.pointerId);
    if(pts.size<2) prev2=null;
    if(pts.size===0) last=null;
  };
  host.addEventListener("pointerup",end);
  host.addEventListener("pointercancel",end);
  host.addEventListener("pointerleave",end);

  host.addEventListener("wheel",e=>{
    const svg=getSvg(e); if(!svg) return;
    if(!e.ctrlKey&&!e.metaKey) return;
    e.preventDefault();
    zoomAt(svg,e.clientX,e.clientY,e.deltaY<0?1.14:1/1.14);
  },{passive:false});

  host.addEventListener("dblclick",e=>{
    const svg=getSvg(e); if(!svg) return;
    e.preventDefault();
    if(MZ.k>1.001) resetMZ(); else zoomAt(svg,e.clientX,e.clientY,2.2);
  });
}

/* ─── 사진 보기 ─── */
let VIEW=null, VIEWDRAG=false, VIEWTOKEN=0;
const PCACHE=new Map();

async function getFull(pid){
  if(PCACHE.has(pid)) return PCACHE.get(pid);
  let src=null;
  try{ src=await Store.get(K_PHOTO(pid)); }catch(e){}
  if(!src) src=S.thumbs[pid]||null;
  PCACHE.set(pid,src);
  if(PCACHE.size>12) PCACHE.delete(PCACHE.keys().next().value);
  return src;
}
function prefetchNeighbors(){
  if(!VIEW) return;
  [VIEW.index-1,VIEW.index+1].forEach(i=>{
    if(i>=0&&i<VIEW.items.length) getFull(VIEW.items[i].pid);
  });
}
function openViewer(items,index){
  VIEW={items:items,index:index};
  drawViewer();
}
async function drawViewer(){
  const host=document.getElementById("viewerHost");
  if(!VIEW){ host.innerHTML=""; return; }
  const it=VIEW.items[VIEW.index];
  const cached=PCACHE.get(it.pid)||null;
  const token=++VIEWTOKEN;
  host.innerHTML='<div class="viewer" data-act="close-viewer">'
    +'<button class="viewer-close" data-act="close-viewer">✕</button>'
    +(VIEW.index>0?'<button class="viewer-nav left" data-nav="-1" aria-label="이전 사진">‹</button>':"")
    +(VIEW.index<VIEW.items.length-1?'<button class="viewer-nav right" data-nav="1" aria-label="다음 사진">›</button>':"")
    +'<figure class="viewer-fig" data-stop="1">'
    +(cached?'<img src="'+cached+'" alt="">':'<div class="viewer-load">사진 불러오는 중</div>')
    +'<figcaption><b>'+esc(it.name)+'</b><span class="num">'+fmtDate(it.date)+'</span>'
    +(it.course?'<em>'+esc(it.course)+'</em>':"")
    +'<span class="num idx">'+(VIEW.index+1)+' / '+VIEW.items.length+'</span></figcaption></figure></div>';
  if(!cached){
    const src=await getFull(it.pid);
    if(token!==VIEWTOKEN||!VIEW) return;
    const load=host.querySelector(".viewer-load");
    if(load&&src) load.outerHTML='<img src="'+src+'" alt="">';
  }
  prefetchNeighbors();
}
function closeViewer(){ VIEW=null; document.getElementById("viewerHost").innerHTML=""; }
function stepViewer(dir){
  if(!VIEW) return;
  const ni=VIEW.index+dir;
  if(ni<0||ni>=VIEW.items.length) return;
  VIEW.index=ni; drawViewer();
}
function bindViewerSwipe(){
  const host=document.getElementById("viewerHost");
  let sx=null, sy=null, pid=null;
  host.addEventListener("pointerdown",e=>{
    if(!VIEW) return;
    sx=e.clientX; sy=e.clientY; pid=e.pointerId; VIEWDRAG=false;
  });
  host.addEventListener("pointermove",e=>{
    if(sx==null||e.pointerId!==pid) return;
    if(Math.abs(e.clientX-sx)>12) VIEWDRAG=true;
  });
  const finish=e=>{
    if(sx==null||e.pointerId!==pid) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    sx=null; pid=null;
    if(!VIEW) return;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){
      VIEWDRAG=true;
      stepViewer(dx<0?1:-1);
    }
  };
  host.addEventListener("pointerup",finish);
  host.addEventListener("pointercancel",()=>{ sx=null; pid=null; });
}

function wireForm(){
  const name=document.getElementById("fName"), sugg=document.getElementById("sugg");
  let cursor=0;
  const matches=()=>{
    const q=name.value.trim(); if(!q) return [];
    const M=[...allMountains().values()];
    if(M.some(m=>m.name===q)) return [];
    const a=[],b=[];
    M.forEach(m=>{ if(m.name.indexOf(q)===0) a.push(m); else if(m.name.indexOf(q)>=0||(m.region||"").indexOf(q)>=0) b.push(m); });
    return a.concat(b).slice(0,7);
  };
  const paint=()=>{
    const ms=matches();
    if(!ms.length){ sugg.hidden=true; sugg.innerHTML=""; return; }
    sugg.hidden=false;
    sugg.innerHTML=ms.map((m,i)=>'<li class="'+(i===cursor?"on":"")+'" data-pick="'+esc(m.name)+'"><b>'+esc(m.name)+'</b>'
      +'<span class="num">'+(m.elev?nf(m.elev)+"m":"")+'</span><em>'+esc(m.region)+'</em></li>').join("");
  };
  name.addEventListener("input",()=>{ D.name=name.value; D.lat=null; D.lng=null; D.region=""; D.fine=false; cursor=0; paint(); refreshName(); });
  name.addEventListener("focus",paint);
  name.addEventListener("blur",()=>setTimeout(()=>{sugg.hidden=true;},140));
  name.addEventListener("keydown",e=>{
    const ms=matches(); if(!ms.length) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); cursor=Math.min(cursor+1,ms.length-1); paint(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); cursor=Math.max(cursor-1,0); paint(); }
    if(e.key==="Enter"){ e.preventDefault(); pickName(ms[cursor].name); }
  });
  sugg.addEventListener("mousedown",e=>{
    const li=e.target.closest("[data-pick]"); if(!li) return;
    e.preventDefault(); pickName(li.dataset.pick);
  });

  document.getElementById("fRegion").addEventListener("change",e=>{
    const r=REGIONS.find(x=>x[0]===e.target.value);
    if(!r){ D.region=""; D.lat=null; D.lng=null; }
    else { const j=jitter(D.name); D.region=r[0]; D.lat=r[1]+j.dLat; D.lng=r[2]+j.dLng; }
    refreshName();
  });
  document.getElementById("fElev").addEventListener("input",e=>{ D.elev=e.target.value; });
  document.getElementById("fFine").addEventListener("click",()=>{ D.fine=!D.fine; refreshName(); });
  document.getElementById("fMap").addEventListener("click",e=>{
    const svg=e.target.closest("svg.map-svg"); if(!svg) return;
    const r=svg.getBoundingClientRect();
    const p=unproj((e.clientX-r.left)/r.width*VW,(e.clientY-r.top)/r.height*VH);
    D.lat=p.lat; D.lng=p.lng; refreshName();
  });

  const grid=document.getElementById("fPhotos"), file=document.getElementById("fFile");
  grid.addEventListener("click",e=>{
    const add=e.target.closest("[data-add]"); if(add){ file.click(); return; }
    const x=e.target.closest("[data-drop]");
    if(x){
      const pid=x.dataset.drop;
      D.photos=D.photos.filter(p=>p!==pid);
      D.newPhotos=D.newPhotos.filter(p=>p.pid!==pid);
      drawPhotos();
    }
  });
  grid.addEventListener("dragover",e=>e.preventDefault());
  grid.addEventListener("drop",e=>{ e.preventDefault(); addFiles(e.dataTransfer.files); });
  file.addEventListener("change",e=>{ addFiles(e.target.files); e.target.value=""; });

  document.getElementById("fPeak").addEventListener("input",e=>{
    const name=document.getElementById("fName").value.trim();
    const el=peakElevOf(name,e.target.value);
    const box=document.getElementById("fPeakElev");
    if(el&&(!box.value||box.dataset.auto==="1")){ box.value=el; box.dataset.auto="1"; }
  });
  document.getElementById("fPeakElev").addEventListener("input",e=>{ e.target.dataset.auto=""; });
  document.getElementById("fSave").addEventListener("click",saveDraft);
  document.getElementById("fDate").addEventListener("input",()=>{
    D.dateTouched=true;
    const hint=document.getElementById("fDateHint"); if(hint) hint.hidden=true;
    refreshName();
  });
}

async function addFiles(list){
  const files=[].filter.call(list||[],f=>f.type.indexOf("image/")===0);
  const errBox=document.getElementById("fErr");
  if(!files.length){ errBox.innerHTML="<p>이미지 파일만 넣을 수 있습니다.</p>"; return; }
  errBox.innerHTML="";
  const btn=document.querySelector(".photo-add"); if(btn) btn.textContent="처리 중";
  const bad=[]; let meta=null;
  for(const f of files){
    try{
      D.newPhotos.push(await processPhoto(f));
      if(!meta||(!meta.lat&&!meta.date)) {
        const m=await photoMeta(f);
        if(!meta) meta=m;
        else { if(!meta.date) meta.date=m.date; if(!meta.lat&&m.lat) { meta.lat=m.lat; meta.lng=m.lng; } }
      }
    }
    catch(e){ bad.push(f.name+" — "+e.message); }
  }
  drawPhotos();
  if(bad.length) errBox.innerHTML=bad.map(m=>"<p>"+esc(m)+"</p>").join("");

  const lines=[];
  if(meta&&meta.date&&!D.dateTouched){
    document.getElementById("fDate").value=meta.date.date; D.date=meta.date.date;
    lines.push((meta.date.source==="file"?"사진 파일 날짜 ":"사진 촬영 날짜 ")+fmtDate(meta.date.date));
  }
  if(meta&&meta.lat!=null&&!document.getElementById("fName").value.trim()){
    const near=nearestMountain(meta.lat,meta.lng);
    if(near&&near.km<15){
      document.getElementById("fName").value=near.m.name;
      D.name=near.m.name; D.lat=null; D.lng=null; D.region="";
      lines.push("사진 위치로 "+near.m.name+" (정상에서 "+fmtKm(near.km)+")");
    }
  }
  const hint=document.getElementById("fDateHint");
  if(lines.length){
    hint.hidden=false;
    hint.innerHTML=lines.map(l=>esc(l)).join("<br>")+"<br>다르면 직접 고치세요.";
  }
  refreshName();
}

async function saveDraft(){
  const name=document.getElementById("fName").value.trim();
  const date=document.getElementById("fDate").value;
  if(!name||!date) return;
  const M=allMountains();
  if(!M.has(name)){
    S.customs.push({name:name,elev:Number(D.elev)||0,lat:D.lat,lng:D.lng,region:D.region||"직접 등록"});
  }
  const prev=S.hikes.find(h=>h.id===D.id);
  const removed=((prev&&prev.photos)||[]).filter(p=>D.photos.indexOf(p)<0);
  const photoIds=D.photos.concat(D.newPhotos.map(p=>p.pid));

  removed.forEach(pid=>{ delete S.thumbs[pid]; });
  D.newPhotos.forEach(p=>{ S.thumbs[p.pid]=p.thumb; });

  try{
    for(const p of D.newPhotos) await Store.set(K_PHOTO(p.pid),p.full);
    for(const pid of removed) await Store.del(K_PHOTO(pid));
  }catch(e){ toast("사진 저장에 실패했습니다. 저장 공간이 찼을 수 있습니다."); }
  await saveThumbs();

  const rec={id:D.id||uid(),name:name,course:document.getElementById("fCourse").value.trim(),date:date,
    hours:document.getElementById("fHours").value.trim(),buddy:document.getElementById("fBuddy").value.trim(),
    note:document.getElementById("fNote").value.trim(),
    peak:document.getElementById("fPeak").value.trim(),
    peakElev:Number(document.getElementById("fPeakElev").value)||null,
    photos:photoIds};
  if(D.id) S.hikes=S.hikes.map(h=>h.id===D.id?rec:h); else S.hikes.push(rec);
  S.selected=name;
  await saveData();
  closeForm(); render();
}

async function deleteDraft(){
  if(!D||!D.id) return;
  if(!confirm("이 기록을 지울까요? 함께 넣은 사진도 사라집니다.")) return;
  const t=S.hikes.find(h=>h.id===D.id), pids=(t&&t.photos)||[];
  pids.forEach(pid=>{ delete S.thumbs[pid]; });
  try{ for(const pid of pids) await Store.del(K_PHOTO(pid)); }catch(e){}
  await saveThumbs();
  S.hikes=S.hikes.filter(h=>h.id!==D.id);
  await saveData();
  closeForm(); render();
}

/* ─── 백업 / 복원 ─── */
async function backup(){
  toast("백업 파일을 만드는 중입니다…");
  const photos={};
  for(const pid of Object.keys(S.thumbs)){
    let full=null;
    try{ full=await Store.get(K_PHOTO(pid)); }catch(e){}
    photos[pid]={thumb:S.thumbs[pid],full:full||S.thumbs[pid]};
  }
  const payload={format:"hikelog",version:1,exportedAt:new Date().toISOString(),
    hikes:S.hikes,customs:S.customs,photos:photos};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="산행일지_백업_"+todayStr()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("백업 파일을 내려받았습니다.");
}

async function restore(file){
  let data;
  try{ data=JSON.parse(await file.text()); }
  catch(e){ toast("백업 파일을 읽지 못했습니다."); return; }
  if(!data||!Array.isArray(data.hikes)){ toast("산행 일지 백업 파일이 아닙니다."); return; }
  if(!confirm("지금 기록을 모두 지우고 백업 내용으로 되돌립니다. 계속할까요?")) return;

  S.hikes=data.hikes; S.customs=data.customs||[]; S.thumbs={};
  const photos=data.photos||{};
  try{
    for(const pid of Object.keys(photos)){
      S.thumbs[pid]=photos[pid].thumb;
      if(photos[pid].full) await Store.set(K_PHOTO(pid),photos[pid].full);
    }
  }catch(e){ toast("사진 일부를 복원하지 못했습니다. 저장 공간이 부족할 수 있습니다."); }
  await saveThumbs(); await saveData();
  S.selected=null; closeSettings(); render();
  toast("복원했습니다. 산행 "+S.hikes.length+"건.");
}

/* ─── 이벤트 ─── */
document.addEventListener("click",e=>{
  const t=e.target;

  if(t.closest("#btnAdd")||t.closest('[data-act="add"]')){ openForm(); return; }
  if(t.closest("#btnSettings")){ openSettings(); return; }
  if(t.closest("#btnBackup")){ backup(); return; }
  if(t.closest("#btnRestore")){ document.getElementById("restoreInput").click(); return; }
  if(t.closest('[data-act="close-settings"]')){ closeSettings(); return; }
  if(t.closest('[data-act="scrim-close-set"]')&&!t.closest("[data-stop]")){ closeSettings(); return; }

  const view=t.closest("[data-view]");
  if(view){ S.view=view.dataset.view; S.selected=S.view==="gallery"?S.selected:S.selected; render(); window.scrollTo(0,0); return; }

  const tab=t.closest("[data-tab]");
  if(tab){ S.tab=tab.dataset.tab; render(); return; }

  const rg=t.closest("[data-region]");
  if(rg){ gotoRegion(+rg.dataset.region); return; }

  const mz=t.closest("[data-mz]");
  if(mz){
    const a=mz.dataset.mz;
    if(a==="in") zoomCenter(1.5);
    else if(a==="out") zoomCenter(1/1.5);
    else resetMZ();
    return;
  }

  const mk=t.closest("[data-mtn]");
  if(mk){
    if(MZ.dragged){ MZ.dragged=false; return; }
    S.selected=(S.selected===mk.dataset.mtn)?null:mk.dataset.mtn; render(); return;
  }

  const selBtn=t.closest("[data-select]");
  if(selBtn){ S.selected=selBtn.dataset.select; render(); return; }

  if(t.closest('[data-act="deselect"]')){ S.selected=null; render(); return; }

  const again=t.closest("[data-again]");
  if(again){ openForm({name:again.dataset.again}); return; }

  const ed=t.closest("[data-edit]");
  if(ed){
    const h=S.hikes.find(x=>x.id===ed.dataset.edit);
    if(h) openForm(Object.assign({},h,{photos:(h.photos||[]).slice(),newPhotos:[],elev:"",region:"",fine:false}));
    return;
  }

  const pv=t.closest("[data-photo-visit]");
  if(pv){
    const h=S.hikes.find(x=>x.id===pv.dataset.photoVisit);
    if(h){
      const items=(h.photos||[]).map(pid=>({pid:pid,name:h.name,date:h.date,course:h.course}));
      openViewer(items,Number(pv.dataset.i)||0);
    }
    return;
  }
  const pa=t.closest("[data-photo-all]");
  if(pa){ openViewer(photoItems(),Number(pa.dataset.photoAll)||0); return; }

  const nav=t.closest("[data-nav]");
  if(nav&&VIEW){ stepViewer(Number(nav.dataset.nav)); return; }
  if(t.closest('[data-act="close-viewer"]')&&!t.closest("[data-stop]")){
    if(VIEWDRAG){ VIEWDRAG=false; return; }
    closeViewer(); return;
  }
  if(t.closest('[data-act="delete"]')){ deleteDraft(); return; }
  if(t.closest('[data-act="close-form"]')){ closeForm(); return; }
  if(t.closest('[data-act="scrim-close"]')&&!t.closest("[data-stop]")){ closeForm(); return; }

  // 지도 빈 곳 클릭 → 선택 해제
  if(t.closest("#mapHost svg")&&!mk){
    if(MZ.dragged){ MZ.dragged=false; return; }
    if(S.selected){ S.selected=null; render(); }
  }
});

document.addEventListener("keydown",e=>{
  if(VIEW){
    if(e.key==="Escape") closeViewer();
    if(e.key==="ArrowRight") stepViewer(1);
    if(e.key==="ArrowLeft") stepViewer(-1);
    return;
  }
  if(D&&e.key==="Escape") closeForm();
  else if(e.key==="Escape"&&document.getElementById("settingsHost").innerHTML) closeSettings();
});

document.addEventListener("change",e=>{
  if(e.target.id==="fDate"&&D) refreshName();
  if(e.target.id==="restoreInput"&&e.target.files[0]){
    restore(e.target.files[0]); e.target.value="";
  }
});

/* ─── 시작 ─── */
(async function init(){
  await openDB();
  bindMapZoom();
  bindViewerSwipe();
  renderRegions();
  try{ const raw=await Store.get(K_DATA); if(raw){ const v=JSON.parse(raw); S.hikes=v.hikes||[]; S.customs=v.customs||[]; } }catch(e){}
  try{ const t=await Store.get(K_THUMBS); if(t) S.thumbs=JSON.parse(t)||{}; }catch(e){}
  render();
  if(S.region>0) gotoRegion(S.region);
})();
</script>
